<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Clipboard Body -->
  <g filter="url(#shadow)">
    <rect x="116" y="110" width="280" height="320" rx="28" fill="url(#clipGrad)" />
  </g>
  
  <!-- Clipboard Clip Top -->
  <rect x="186" y="85" width="140" height="48" rx="14" fill="#64748b" />
  <rect x="216" y="70" width="80" height="30" rx="10" fill="#334155" />
  <circle cx="256" cy="109" r="8" fill="#ffffff" />
  
  <!-- Order Lines & Checkmarks -->
  <!-- Line 1: Checked -->
  <rect x="156" y="180" width="26" height="26" rx="6" fill="#10b981" />
  <path d="M162 193 L167 198 L177 186" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="196" y="185" width="150" height="16" rx="8" fill="#94a3b8" />
  
  <!-- Line 2: Checked -->
  <rect x="156" y="235" width="26" height="26" rx="6" fill="#10b981" />
  <path d="M162 248 L167 253 L177 241" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="196" y="240" width="120" height="16" rx="8" fill="#94a3b8" />
  
  <!-- Line 3: Calendar Date Badge -->
  <rect x="156" y="290" width="26" height="26" rx="6" fill="#3b82f6" />
  <rect x="160" y="295" width="18" height="16" rx="3" fill="#ffffff" />
  <rect x="160" y="295" width="18" height="5" rx="1" fill="#ef4444" />
  <rect x="196" y="295" width="160" height="16" rx="8" fill="#cbd5e1" />
  
  <!-- Line 4: Price / Amount Badge -->
  <rect x="156" y="348" width="85" height="26" rx="8" fill="#dbeafe" />
  <text x="198" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">€ BEST</text>
  <rect x="256" y="353" width="100" height="16" rx="8" fill="#cbd5e1" />
</svg>
